name: Update Xion Testnet Chain Registry on Release

# Thin trigger around scripts/update-chain-registry.sh, which owns all of the
# registry-update logic and can be run locally the same way.

on:
  repository_dispatch:
    types: [xion-assets-testnet-release-trigger]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Xion release tag (e.g., v24.0.0)'
        required: true
      release_name:
        description: 'Xion release name'
        required: false

jobs:
  update-chain-registry-testnet:
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout xion-assets
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set release variables
        id: release_vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG_NAME="${{ github.event.client_payload.tag_name }}"
            RELEASE_NAME="${{ github.event.client_payload.release_name }}"
          else
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            RELEASE_NAME="${{ github.event.inputs.release_name }}"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

      - name: Update chain registry files
        id: update
        run: ./scripts/update-chain-registry.sh testnet "${{ steps.release_vars.outputs.tag_name }}"

      - name: Create new branch
        id: create_branch
        env:
          VERSION_TAG: ${{ steps.release_vars.outputs.tag_name }}
        run: |
          set -Eeuo pipefail

          # Construct branch name and sanitize
          NEW_BRANCH="upgrade/testnet/${VERSION_TAG}"
          NEW_BRANCH=$(echo "$NEW_BRANCH" | sed 's|/$||g' | sed 's|\.$||g' | sed 's|//\+|/|g' | sed 's|\.\.|.|g' | sed 's|[^a-zA-Z0-9/._-]|-|g')

          # Delete remote branch if it exists (re-run scenario), then create fresh
          if git ls-remote --heads origin "${NEW_BRANCH}" | grep -q "${NEW_BRANCH}"; then
            git push origin --delete "${NEW_BRANCH}" || true
          fi
          git checkout -b "${NEW_BRANCH}"
          git push --set-upstream origin "${NEW_BRANCH}"
          echo "new_branch=${NEW_BRANCH}" >> $GITHUB_OUTPUT

      - name: Commit changes
        id: commit_changes
        uses: pirafrank/github-commit-sign@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
            args: |
              commit \
                --owner=${{ github.repository_owner }} \
                --repo=${{ github.event.repository.name }} \
                --branch=${{ steps.create_branch.outputs.new_branch }} \
                --commitMessage="chore(xion-testnet): update testnet to ${{ steps.release_vars.outputs.tag_name }}" \
                --changed="public/chain-registry/testnets/xiontestnet2/chain.json" \
                --changed="public/chain-registry/testnets/xiontestnet2/versions.json"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_BRANCH: ${{ steps.create_branch.outputs.new_branch }}
          TAG_NAME: ${{ steps.release_vars.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.release_vars.outputs.release_name }}
          SDK_VERSION: ${{ steps.update.outputs.sdk_version }}
          COMETBFT_VERSION: ${{ steps.update.outputs.cometbft_version }}
          WASMD_VERSION: ${{ steps.update.outputs.wasmd_version }}
          IBC_VERSION: ${{ steps.update.outputs.ibc_version }}
          GO_VERSION: ${{ steps.update.outputs.go_version }}
          DARWIN_AMD64_CHECKSUM: ${{ steps.update.outputs.darwin_amd64 }}
          DARWIN_ARM64_CHECKSUM: ${{ steps.update.outputs.darwin_arm64 }}
          LINUX_AMD64_CHECKSUM: ${{ steps.update.outputs.linux_amd64 }}
          LINUX_ARM64_CHECKSUM: ${{ steps.update.outputs.linux_arm64 }}
          PROPOSAL_FOUND: ${{ steps.update.outputs.proposal_found }}
          PROPOSAL_NUM: ${{ steps.update.outputs.proposal }}
          HEIGHT: ${{ steps.update.outputs.height }}
        run: |
          set -Eeuo pipefail

          # Build PR body
          PR_BODY="## Automated Update from Xion Testnet Release

          This PR updates the Xion testnet (xiontestnet2) chain registry to release **${TAG_NAME}**.

          ### Changes
          - Updated \`public/chain-registry/testnets/xiontestnet2/chain.json\` with new binaries and versions
          - Updated \`public/chain-registry/testnets/xiontestnet2/versions.json\` with new version entry

          ### Release Details
          - **Tag**: ${TAG_NAME}
          - **Release**: ${RELEASE_NAME}
          - **Cosmos SDK**: ${SDK_VERSION}
          - **CometBFT**: ${COMETBFT_VERSION}
          - **CosmWasm**: ${WASMD_VERSION}
          - **IBC**: ${IBC_VERSION}
          - **Go**: ${GO_VERSION}

          ### Binaries
          - darwin/amd64: \`sha256:${DARWIN_AMD64_CHECKSUM}\`
          - darwin/arm64: \`sha256:${DARWIN_ARM64_CHECKSUM}\`
          - linux/amd64: \`sha256:${LINUX_AMD64_CHECKSUM}\`
          - linux/arm64: \`sha256:${LINUX_ARM64_CHECKSUM}\`

          ### Governance Info
          "

          if [ "$PROPOSAL_FOUND" = "true" ]; then
            PR_BODY="${PR_BODY}- **Proposal**: #${PROPOSAL_NUM}
          - **Height**: ${HEIGHT}

          ✅ Height and proposal extracted from [xion-testnet-2](https://github.com/burnt-labs/xion-testnet-2/tree/main/proposals).
          "
          else
            PR_BODY="${PR_BODY}⚠️ **Manual Review Required**: Height and proposal not found in xion-testnet-2 proposals. Please update these fields manually.
          "
          fi

          PR_BODY="${PR_BODY}---
          🤖 This PR was automatically created by the chain-registry testnet update workflow."

          gh pr create \
            --base main \
            --draft \
            --title "Update Xion Testnet to ${TAG_NAME}" \
            --body "$PR_BODY" \
            --head "$NEW_BRANCH" || true
